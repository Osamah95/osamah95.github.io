<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bernabéu Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed horse photo; clock bottom-left, weather top-right, Real Madrid fixtures bottom-right.
   Sized in vw so it scales from a laptop preview to the 3840x2160 TV. */
:root{
  --ink:#f6efe4;          /* warm ivory text */
  --ink-soft:rgba(246,239,228,.72);
  --shade:rgba(12,9,6,.55);
  --gold:#d9b46a;         /* saddle-leather gold accent */
  --live:#e5484d;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --body:"Manrope","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0;height:100%;background:#0c0906;color:var(--ink);overflow:hidden;font-family:var(--body);cursor:none}
.stage{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#0c0906}
.slide{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:0;transition:opacity 3s ease;transform:scale(1.02)}
.slide.on{opacity:1;animation:drift 70s linear forwards}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}
.vignette{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
  background:linear-gradient(to top,rgba(10,7,4,.78) 0%,rgba(10,7,4,.25) 38%,rgba(10,7,4,0) 60%),
             linear-gradient(to bottom,rgba(10,7,4,.45) 0%,rgba(10,7,4,0) 22%)}

.clock{position:absolute;left:4.2vw;bottom:4.6vw;text-shadow:0 .2vw 1.4vw rgba(0,0,0,.45)}
.time{font-family:var(--display);font-weight:400;font-size:13.5vw;line-height:.86;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums;display:flex;align-items:baseline}
.time .sec{font-size:3.2vw;color:var(--gold);margin-left:1.2vw;letter-spacing:0}
.date{margin-top:1.4vw;font-size:1.9vw;font-weight:500;letter-spacing:.06em;color:var(--ink-soft)}
.date b{color:var(--ink);font-weight:700}
.hijri{font-size:1.35vw;color:var(--ink-soft);margin-top:.4vw;direction:rtl;text-align:left;unicode-bidi:plaintext}

.weather{position:absolute;top:3.4vw;right:4.2vw;text-align:right;text-shadow:0 .15vw 1vw rgba(0,0,0,.5)}
.temp{font-family:var(--display);font-size:6.4vw;line-height:1;font-variant-numeric:lining-nums}
.temp sup{font-size:2.6vw;color:var(--gold);vertical-align:top;position:relative;top:.6vw}
.wx-line{font-size:1.45vw;font-weight:500;color:var(--ink);margin-top:.5vw}
.wx-sub{font-size:1.15vw;color:var(--ink-soft);margin-top:.3vw;letter-spacing:.04em}

.matches{position:absolute;right:4.2vw;bottom:4.6vw;width:30vw;background:var(--shade);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:1vw;padding:1.6vw 1.8vw;
  border:1px solid rgba(246,239,228,.12)}
.m-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1vw}
.m-title{font-size:1.05vw;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.m-src{font-size:.8vw;color:var(--ink-soft);letter-spacing:.06em}
.next{padding-bottom:1.1vw;margin-bottom:.9vw;border-bottom:1px solid rgba(246,239,228,.14)}
.next .vs{font-family:var(--display);font-size:2.3vw;line-height:1.1}
.next .meta{font-size:1.15vw;color:var(--ink-soft);margin-top:.45vw}
.count{display:inline-block;margin-top:.7vw;font-size:1.05vw;font-weight:700;letter-spacing:.08em;color:#1a1208;background:var(--gold);border-radius:.3vw;padding:.25vw .6vw;font-variant-numeric:tabular-nums}
.count.live{background:var(--live);color:#fff}
.row{display:flex;justify-content:space-between;gap:1vw;font-size:1.1vw;padding:.45vw 0}
.row .opp{font-weight:500;min-width:0}
.row .when{color:var(--ink-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.comp{font-size:.8vw;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.credit{position:absolute;left:4.2vw;top:3.4vw;font-size:.75vw;color:rgba(246,239,228,.45);letter-spacing:.05em}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="vignette"></div>

<div class="credit" id="credit"></div>

<section class="weather" aria-label="Weather in Mosul">
  <div class="temp" id="temp">--<sup>°C</sup></div>
  <div class="wx-line" id="wxLine">Mosul</div>
  <div class="wx-sub" id="wxSub">Loading weather…</div>
</section>

<section class="clock" aria-label="Time">
  <div class="time"><span id="hm">--:--</span><span class="sec" id="sec">--</span></div>
  <div class="date" id="date"></div>
  <div class="hijri" id="hijri"></div>
</section>

<section class="matches" aria-label="Real Madrid fixtures">
  <div class="m-head"><span class="m-title">Real Madrid</span><span class="m-src" id="mSrc">Baghdad time</span></div>
  <div id="mBody"></div>
</section>

<script>
(function(){
"use strict";
var TZ="Asia/Baghdad";
var LAT=36.34, LON=43.13, PLACE="Mosul";

/* ---------- Wallpapers: 4K Santiago Bernabéu photos (Wikimedia Commons, free licences) ----------
   Add your own: open the page with ?img=URL1|URL2 */
var FILES=[
  "Estadio_Santiago_Bernabeu_(53988637843).jpg",
  "Estadio_Santiago_Bernabeu_-_Field.jpg",
  "Exterior_Estadio_Santiago_Bernabéu.jpg",
  "170928_Estadio_Santiago_Bernabéu.jpg",
  "Estadio_Santiago_Bernabéu_(2014).JPG",
  "Estadio_Santiago_Bernabéu_03.jpg",
  "Estadio_Santiago_Bernabéu_32.jpg",
  "Estadio_Santiago_Bernabéu_11.jpg",
  "Estadio_Santiago_Bernabéu..jpeg"
];
function commons(f){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width=3840";}
var IMGS=[], CREDITS=[];
var q=new URLSearchParams(location.search);
if(q.get("img")){q.get("img").split("|").forEach(function(u){IMGS.push(u);CREDITS.push("");});}
else{FILES.forEach(function(f){IMGS.push(commons(f));CREDITS.push("Photo: Wikimedia Commons · "+f.replace(/_/g," ").replace(/\.+jpe?g$/i,""));});}
var SLIDE_MS=(+q.get("every")||75)*1000;

var stage=document.getElementById("stage"), creditEl=document.getElementById("credit");
var good=[], idx=-1, current=null;
function preload(i){
  var im=new Image();
  im.onload=function(){good.push(i); if(good.length===1) next();};
  im.src=IMGS[i];
}
IMGS.forEach(function(_,i){preload(i);});
function next(){
  if(!good.length) return;
  idx=(idx+1)%good.length;
  var i=good[idx];
  var d=document.createElement("div");
  d.className="slide";
  d.style.backgroundImage="url(\""+IMGS[i]+"\")";
  stage.appendChild(d);
  requestAnimationFrame(function(){requestAnimationFrame(function(){d.className="slide on";});});
  var old=current; current=d;
  if(old){old.className="slide"; setTimeout(function(){old.remove();},3500);}
  creditEl.textContent=CREDITS[i];
}
setInterval(next,SLIDE_MS);

/* ---------- Clock ---------- */
var fHM=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
var fS=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,second:"2-digit"});
var fD=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
var fH; try{fH=new Intl.DateTimeFormat("ar-IQ-u-ca-islamic-umalqura",{timeZone:TZ,day:"numeric",month:"long",year:"numeric"});}catch(e){fH=null;}
function tick(){
  var n=new Date();
  document.getElementById("hm").textContent=fHM.format(n);
  var s=fS.format(n); document.getElementById("sec").textContent=(s.length<2?"0":"")+s;
  var parts=fD.format(n).split(" ");
  document.getElementById("date").innerHTML="<b>"+parts[0].replace(",","")+"</b> · "+parts.slice(1).join(" ");
  if(fH) document.getElementById("hijri").textContent=fH.format(n);
  renderCountdown();
}
setInterval(tick,1000);

/* ---------- Weather (Open-Meteo, no key) ---------- */
var WMO={0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",
80:"Rain showers",81:"Rain showers",82:"Violent showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
function weather(){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone="+encodeURIComponent(TZ)+"&forecast_days=1";
  fetch(u).then(function(r){return r.json();}).then(function(j){
    var c=j.current, d=j.daily;
    document.getElementById("temp").innerHTML=Math.round(c.temperature_2m)+"<sup>°C</sup>";
    document.getElementById("wxLine").textContent=PLACE+" · "+(WMO[c.weather_code]||"");
    document.getElementById("wxSub").textContent="H "+Math.round(d.temperature_2m_max[0])+"°  L "+Math.round(d.temperature_2m_min[0])+"°  ·  Feels "+Math.round(c.apparent_temperature)+"°  ·  "+c.relative_humidity_2m+"% humidity";
  }).catch(function(){document.getElementById("wxSub").textContent="Weather unavailable, retrying";});
}
weather(); setInterval(weather,15*60*1000);

/* ---------- Real Madrid fixtures ---------- */
/* Live source: ESPN public schedule (team id 86), all competitions. */
var LEAGUES=[["esp.1","La Liga"],["uefa.champions","Champions League"],["esp.copa_del_rey","Copa del Rey"],["esp.super_cup","Super Cup"],["fifa.cwc","Club World Cup"]];
/* Backup list (published schedule, checked 25 Oct 2026). t = UTC ISO; tbc = kick-off not yet set */
var BACKUP=[
 {t:"2026-11-01T18:00:00Z",tbc:true,home:"Racing Santander",away:"Real Madrid",comp:"La Liga"},
 {t:"2026-11-04T17:45:00Z",home:"AEK Athens",away:"Real Madrid",comp:"Champions League"},
 {t:"2026-11-08T18:00:00Z",tbc:true,home:"Valencia",away:"Real Madrid",comp:"La Liga"},
 {t:"2026-11-22T18:00:00Z",tbc:true,home:"Real Madrid",away:"Celta Vigo",comp:"La Liga"},
 {t:"2026-11-24T20:00:00Z",home:"Real Madrid",away:"PSV",comp:"Champions League"},
 {t:"2026-11-29T18:00:00Z",tbc:true,home:"Real Madrid",away:"Alavés",comp:"La Liga"},
 {t:"2026-12-06T18:00:00Z",tbc:true,home:"Athletic Bilbao",away:"Real Madrid",comp:"La Liga"},
 {t:"2026-12-09T20:00:00Z",home:"Arsenal",away:"Real Madrid",comp:"Champions League"},
 {t:"2026-12-13T18:00:00Z",tbc:true,home:"Real Madrid",away:"Osasuna",comp:"La Liga"},
 {t:"2026-12-20T18:00:00Z",tbc:true,home:"Deportivo La Coruña",away:"Real Madrid",comp:"La Liga"},
 {t:"2027-01-19T20:00:00Z",home:"Real Madrid",away:"LASK",comp:"Champions League"},
 {t:"2027-01-27T20:00:00Z",home:"Shakhtar Donetsk",away:"Real Madrid",comp:"Champions League"}
];
var fixtures=[], source="backup";
function short(n){return n.replace("Real Madrid","Real Madrid");}
function fetchLeague(l){
  return fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/"+l[0]+"/teams/86/schedule?fixture=true")
   .then(function(r){if(!r.ok) throw 0; return r.json();})
   .then(function(j){
     return (j.events||[]).map(function(e){
       var c=(e.competitions||[])[0]||{}, h="",a="";
       (c.competitors||[]).forEach(function(t){var nm=(t.team&&(t.team.shortDisplayName||t.team.displayName))||"?"; if(t.homeAway==="home")h=nm; else a=nm;});
       var st=(c.status&&c.status.type)||{};
       return {id:e.id,t:e.date,home:h,away:a,comp:l[1],tbc:!!(c.timeValid===false),state:st.state||"pre"};
     });
   }).catch(function(){return [];});
}
function loadFixtures(){
  Promise.all(LEAGUES.map(fetchLeague)).then(function(lists){
    var all=[].concat.apply([],lists), seen={};
    all=all.filter(function(m){if(!m.t||seen[m.id])return false; seen[m.id]=1; return true;});
    if(all.length){fixtures=all; source="live";} else {fixtures=BACKUP; source="backup";}
    renderMatches();
  });
}
var fWhen=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"short",day:"numeric",month:"short"});
var fKO=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
function upcoming(){
  var now=Date.now();
  return fixtures.filter(function(m){var t=Date.parse(m.t); return t+2.25*3600e3>now && m.state!=="post";})
                 .sort(function(a,b){return Date.parse(a.t)-Date.parse(b.t);});
}
function opp(m){return m.home.indexOf("Real Madrid")===0?m.away+" (H)":m.home+" (A)";}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function renderMatches(){
  var list=upcoming(), body=document.getElementById("mBody");
  document.getElementById("mSrc").textContent=(source==="live"?"Live":"Saved list")+" · Baghdad time";
  if(!list.length){body.innerHTML='<div class="row"><span class="opp">No upcoming matches found</span></div>';return;}
  var n=list[0], d=new Date(n.t);
  var html='<div class="next"><div class="comp">Next · '+esc(n.comp)+'</div>'+
    '<div class="vs">'+esc(n.home)+' <span style="color:var(--gold)">v</span> '+esc(n.away)+'</div>'+
    '<div class="meta">'+fWhen.format(d)+' · '+(n.tbc?"Kick-off TBC":fKO.format(d))+'</div>'+
    '<span class="count" id="count"></span></div>';
  list.slice(1,5).forEach(function(m){
    var dm=new Date(m.t);
    html+='<div class="row"><span class="opp">'+esc(opp(m))+'<br><span class="comp">'+esc(m.comp)+'</span></span>'+
          '<span class="when">'+fWhen.format(dm)+'<br>'+(m.tbc?"TBC":fKO.format(dm))+'</span></div>';
  });
  body.innerHTML=html; renderCountdown();
}
function renderCountdown(){
  var el=document.getElementById("count"); if(!el) return;
  var n=upcoming()[0]; if(!n) return;
  var diff=Date.parse(n.t)-Date.now();
  if(diff<=0){el.textContent="LIVE NOW"; el.className="count live"; return;}
  el.className="count";
  if(n.tbc){var days=Math.round(diff/864e5); el.textContent=days<=0?"TODAY":"IN "+days+" DAY"+(days===1?"":"S"); return;}
  var d=Math.floor(diff/864e5), h=Math.floor(diff%864e5/36e5), m=Math.floor(diff%36e5/6e4);
  el.textContent=d>0?("IN "+d+"D "+h+"H "+m+"M"):("IN "+h+"H "+m+"M");
}
fixtures=BACKUP; renderMatches(); loadFixtures();
setInterval(loadFixtures,3*3600e3);
setInterval(renderMatches,60e3);

tick();
/* Reload once a day at ~04:00 to keep the TV browser fresh */
setInterval(function(){var h=+new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",hour12:false}).format(new Date()); if(h===4 && performance.now()>3600e3) location.reload();},30*60e3);
})();
</script>
</body>
</html>
